name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker compose -f compose.test.yaml build tests
      - name: Ruff lint
        run: docker compose -f compose.test.yaml run --rm --no-deps tests ruff check .
      - name: Ruff format
        run: docker compose -f compose.test.yaml run --rm --no-deps tests ruff format --check .
      - name: All pytest tests with real PostgreSQL and Redis
        run: docker compose -f compose.test.yaml run --rm tests
      - name: Start the four application services
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Check deployed API
        run: curl --fail --show-error --silent http://localhost:8000/tariffs
      - name: Logs on failure
        if: failure()
        run: |
          docker compose logs --no-color
          docker compose -f compose.test.yaml logs --no-color
      - name: Stop containers
        if: always()
        run: |
          docker compose down
          docker compose -f compose.test.yaml down

  publish:
    name: Publish tested application image
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --target runtime \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$image:$GITHUB_SHA" \
            --tag "$image:latest" .
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"
      - name: Log out
        if: always()
        run: docker logout ghcr.io
